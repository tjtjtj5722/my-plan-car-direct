<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>김중훈의 마이플랜 다이렉트</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="theme-color" content="#1D4ED8">
<meta name="description" content="김중훈의 마이플랜 다이렉트 - 자동차보험, 더 간편하게 더 합리적으로">
<link rel="icon" type="image/png" sizes="48x48" href="icon-48.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="마이플랜">
<meta property="og:title" content="김중훈의 마이플랜 다이렉트">
<meta property="og:description" content="자동차보험, 더 간편하게 더 합리적으로 · 상담 010-5742-8603">
<meta property="og:image" content="icon-512.png">
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<style id="cd-style">
/* Layout: 휴대폰 앱처럼 한 줄 세로 화면 + 하단 탭(홈·서비스·강의·후기·전체). 안내판 남색 머리띠, 신호 황색 하나, 번호판 모양 입력창 */
:root{
  --bg:#EDF2F9; --app:#F4F7FC; --surface:#FFFFFF; --surface-2:#F7FAFF; --ink:#0B1626; --muted:#3F4F64; --line:#DCE4EF; --line-soft:#E9EFF7;
  --sign:#0A2C66; --sign-ink:#FFFFFF; --amber:#1D5BD8; --amber-ink:#FFFFFF; --amber-soft:#EAF1FD; --blue-2:#3B82F6; --tile:linear-gradient(145deg,#EEF4FF,#DCE8FF); --ok:#1F7A4D; --bad:#B83A2E; --sos:#C8281E; --sos-ink:#FFFFFF; --sos-soft:#FDECEA;
  --f-display:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sh:0 1px 2px rgba(13,40,90,.04),0 4px 12px rgba(13,40,90,.05),0 18px 36px -14px rgba(13,40,90,.14); --sh-h:0 2px 4px rgba(13,40,90,.06),0 12px 26px rgba(13,40,90,.09),0 30px 52px -18px rgba(13,40,90,.24); --seg:#E6EDF7;
  --r:12px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050A13; --app:#08101C; --surface:#0F1A2B; --surface-2:#122036; --ink:#F1F5FB; --muted:#B4C1D3; --line:#1E2C44; --line-soft:#182538;
  --sign:#0A2350; --sign-ink:#FFFFFF; --amber:#4A86F7; --amber-ink:#FFFFFF; --amber-soft:#14284D; --blue-2:#6EA2FF; --tile:linear-gradient(145deg,#16305C,#1B3A70);
  --sh:0 0 0 1px rgba(255,255,255,.02),0 10px 30px rgba(0,0,0,.35); --sh-h:0 0 0 1px rgba(110,162,255,.18),0 18px 40px rgba(0,0,0,.5); --seg:#15223A; --ok:#4CC28A; --bad:#F08A7E; --sos:#E5483C; --sos-ink:#FFFFFF; --sos-soft:#3A1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050A13; --app:#08101C; --surface:#0F1A2B; --surface-2:#122036; --ink:#F1F5FB; --muted:#B4C1D3; --line:#1E2C44; --line-soft:#182538;
  --sign:#0A2350; --sign-ink:#FFFFFF; --amber:#4A86F7; --amber-ink:#FFFFFF; --amber-soft:#14284D; --blue-2:#6EA2FF; --tile:linear-gradient(145deg,#16305C,#1B3A70);
  --sh:0 0 0 1px rgba(255,255,255,.02),0 10px 30px rgba(0,0,0,.35); --sh-h:0 0 0 1px rgba(110,162,255,.18),0 18px 40px rgba(0,0,0,.5); --seg:#15223A; --ok:#4CC28A; --bad:#F08A7E; --sos:#E5483C; --sos-ink:#FFFFFF; --sos-soft:#3A1715; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;word-break:keep-all}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--app);position:relative;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px)}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sign)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sign);color:var(--sign-ink)}
.top .gut{display:flex;align-items:center;gap:10px;height:56px}
.back{background:none;border:0;width:36px;height:36px;margin-left:-8px;display:grid;place-items:center;cursor:pointer;border-radius:8px}
.back[hidden]{display:none}
.top-title{font-family:var(--f-display);font-size:20px;flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.top-title i{width:12px;height:12px;background:var(--amber);border-radius:2px;transform:rotate(45deg);flex:none}
.top-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block}
.admin-chip{font-size:11px;font-weight:700;letter-spacing:.06em;border:1px solid var(--amber);color:var(--amber);border-radius:4px;padding:2px 6px;white-space:nowrap}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{height:var(--tabh);display:grid;place-items:center;align-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs a[aria-current="page"] svg{color:var(--amber)}

.screen{display:grid;gap:20px;padding-block:20px 8px}
.screen[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-t h2{font-size:18px;font-weight:700}
.sec-t a{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:var(--r);padding:15px 18px;font:700 16px/1 var(--f-body);cursor:pointer;text-decoration:none}
.btn-amber{background:var(--amber);color:var(--amber-ink)}
.btn-line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.draft{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber);padding:2px 7px;border-radius:4px;justify-self:start}

.hero{background:var(--sign);color:var(--sign-ink);border-radius:16px;padding:22px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--amber) 0 36px,transparent 36px 60px)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:30px}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{opacity:.88;font-size:15px}
.hero .kicker{font-size:13px;letter-spacing:.12em;color:var(--amber);font-weight:700}

.plate{display:flex;align-items:center;gap:10px;background:#FFFFFF;color:#111;border:3px solid #111;border-radius:8px;padding:6px 12px}
.plate::before,.plate::after{content:"";width:8px;height:8px;border-radius:50%;background:#111;flex:none}
.plate input{flex:1;min-width:0;border:0;background:transparent;color:#111;font:600 24px var(--f-mono);letter-spacing:.06em;text-align:center;padding:6px 0}
.plate input::placeholder{color:#9AA3AB}
.plate input:focus{outline:none}
.plate:focus-within{box-shadow:0 0 0 3px var(--amber)}

.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick a{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-size:13px;font-weight:500;text-align:center;line-height:1.3}
.quick a:hover{background:var(--surface)}
.qi{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--sign)}
.qi svg{width:26px;height:26px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qi{color:var(--amber)}}
:root[data-theme="dark"] .qi{color:var(--amber)}

.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.step b{width:36px;height:36px;border-radius:50%;background:var(--amber-soft);border:1.5px solid var(--amber);display:grid;place-items:center;font:600 14px var(--f-mono)}
.step h3{font-size:16px}
.step p{font-size:14px;color:var(--muted)}

.call{display:flex;align-items:center;justify-content:space-between;gap:12px}
.call strong{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.copy{background:none;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.note{font-size:13px;color:var(--muted);min-height:1.2em}

.rows{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:16px;text-decoration:none;color:var(--ink);border:0;background:none;width:100%;text-align:left;cursor:pointer}
.row + .row{border-top:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px}
.row .t span{font-size:13px;color:var(--muted)}
.row .ic{width:40px;height:40px;border-radius:10px;background:var(--amber-soft);display:grid;place-items:center;flex:none}
.row .ic svg{width:22px;height:22px}
.chev{color:var(--muted);flex:none}
#homeRooms > div + div,#roomList > div + div,.dyn-rows > div + div{border-top:1px solid var(--line)}
/* 무지개 반응형 배너 */
.rainbow{position:relative;border-radius:18px;padding:3px;text-decoration:none;color:var(--ink);display:block;isolation:isolate;
  background:linear-gradient(115deg,#FF4D4D,#FF9F1C,#FFE14D,#3DDC84,#2EC4FF,#5B6CFF,#C455FF,#FF4D9E,#FF4D4D);background-size:300% 300%;
  transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.rainbow .rb-in{position:relative;overflow:hidden;border-radius:15px;background:var(--surface);padding:20px 18px;display:grid;gap:6px}
.rainbow .rb-in::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.55),transparent 60%),linear-gradient(115deg,rgba(255,77,77,.12),rgba(255,225,77,.12),rgba(61,220,132,.12),rgba(46,196,255,.12),rgba(196,85,255,.12));pointer-events:none;mix-blend-mode:normal}
.rainbow .rb-in > *{position:relative}
.rainbow small{font-size:12px;font-weight:700;letter-spacing:.1em;background:linear-gradient(90deg,#FF4D4D,#FF9F1C,#3DDC84,#2EC4FF,#C455FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.rainbow b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.25}
.rainbow span.sub{font-size:14px;color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rainbow .rb-in::before{background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.16),transparent 60%),linear-gradient(115deg,rgba(255,77,77,.14),rgba(255,225,77,.12),rgba(61,220,132,.12),rgba(46,196,255,.14),rgba(196,85,255,.14))}}
:root[data-theme="dark"] .rainbow .rb-in::before{background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.16),transparent 60%),linear-gradient(115deg,rgba(255,77,77,.14),rgba(255,225,77,.12),rgba(61,220,132,.12),rgba(46,196,255,.14),rgba(196,85,255,.14))}
@media (prefers-reduced-motion:no-preference){.rainbow{animation:rbflow 6s linear infinite}@keyframes rbflow{0%{background-position:0% 50%}100%{background-position:300% 50%}}}
@media (prefers-reduced-motion:reduce){.rainbow{transform:none;transition:none}}
/* 사고 접수 */
.sos-card{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--sos);color:var(--sos-ink);border-radius:var(--r);padding:16px}
.sos-card .ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.sos-card .t{flex:1;min-width:0;display:grid;gap:2px}
.sos-card .t b{font-size:18px}
.sos-card .t span{font-size:13px;opacity:.9}
.dial{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dial-btn{display:grid;gap:2px;padding:14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.dial-btn small{font-size:12px;color:var(--muted);font-weight:700}
.dial-btn strong{font:600 22px var(--f-mono);font-variant-numeric:tabular-nums}
.dial-btn.hot{background:var(--sos);border-color:var(--sos);color:var(--sos-ink)}
.dial-btn.hot small{color:var(--sos-ink);opacity:.85}
.dial-btn.wide{grid-column:1/-1}
.sos-steps{display:grid;gap:12px;counter-reset:st}
.sos-steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;list-style:none}
.sos-steps li::before{counter-increment:st;content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--sos-soft);color:var(--sos);border:1.5px solid var(--sos);display:grid;place-items:center;font:600 13px var(--f-mono)}
.sos-steps b{display:block;font-size:15px}
.sos-steps span{font-size:14px;color:var(--muted)}
.sos-steps ol{margin:0;padding:0}
.ins-row{display:flex;align-items:center;gap:10px;padding:13px 16px}
.ins-row + .ins-row{border-top:1px solid var(--line)}
.ins-row .nm{flex:1;min-width:0;font-weight:500}
.ins-row strong{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
.ins-row a{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 9px}
/* 달력 */
.cal-hero{display:grid;gap:10px}
.cal-badge{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--sos-ink);background:var(--sos);border-radius:4px;padding:3px 8px}
.cal-hero h1{font-family:var(--f-display);font-weight:400;font-size:28px}
.cal-hero p{white-space:pre-line;color:var(--muted);font-size:15px}
.stock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stock div{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:2px}
.stock small{font-size:13px;color:var(--muted);font-weight:700}
.stock strong{font:600 28px var(--f-mono);font-variant-numeric:tabular-nums}
.stock strong em{font:500 14px var(--f-body);font-style:normal;color:var(--muted);margin-left:4px}
.stock .out strong{color:var(--muted);text-decoration:line-through}
.ship{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gallery a{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface);aspect-ratio:3/4;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .gx{display:grid;gap:4px}
/* 과실 사례 · 만화 */
.fault{display:grid;gap:10px;padding:0;overflow:hidden}
.fault img{width:100%;display:block;background:var(--app)}
.fault .fb{padding:0 16px 16px;display:grid;gap:6px}
.fault .ratio{justify-self:start;font:700 15px/1.6 var(--f-body);background:var(--sign);color:var(--sign-ink);border-radius:8px;padding:6px 10px;white-space:pre-line}
.fault b{font-size:17px}
.fault p{font-size:14px;color:var(--muted);white-space:pre-line}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chipbar button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chipbar button[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ccell{display:grid;gap:4px;min-width:0}
.cthumb{display:block;width:100%;aspect-ratio:7/10;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface);padding:0;cursor:pointer}
.cthumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ccell span{font-size:12px;line-height:1.35;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ccell .adm{display:flex;gap:8px;flex-wrap:wrap}
.ccell .adm button{font-size:11px;padding:0}
.ccell input{width:100%;font:13px var(--f-body);padding:6px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:30%;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.lb{position:fixed;inset:0;z-index:20;background:rgba(5,10,15,.94);display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);color:#F3F6F9}
.lb[hidden]{display:none}
.lb-top{display:flex;align-items:center;gap:10px;padding:12px 16px}
.lb-top b{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-top small{font:600 12px var(--f-mono);opacity:.75}
.lb-x{background:none;border:0;color:inherit;font-size:28px;line-height:1;cursor:pointer;padding:4px 8px}
.lb-img{min-height:0;display:grid;place-items:center;padding:0 8px;overflow:auto;touch-action:pan-y pinch-zoom}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lb-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.lb-nav button{border:1.5px solid rgba(255,255,255,.3);background:transparent;color:inherit;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}
.lb-nav button:disabled{opacity:.3}
/* 도구 · 검색 */
.icon-btn{background:none;border:0;color:inherit;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;cursor:pointer;flex:none}
.tool-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tool-tabs button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.tool-tabs button[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.calc{display:grid;gap:14px}
.calc .field input,.calc .field select{font-variant-numeric:tabular-nums}
.unit{position:relative}
.unit input{padding-right:52px}
.unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}
.result{background:var(--sign);color:var(--sign-ink);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.result .big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.result dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dday{display:grid;gap:0}
.dd-row{display:flex;align-items:center;gap:12px;padding:12px 16px}

.dd-row .t span{font:600 12px var(--f-mono);color:var(--muted)}
.dd{font:700 15px var(--f-mono);padding:5px 9px;border-radius:8px;background:var(--app);border:1.5px solid var(--line);white-space:nowrap}

.dd.over{background:var(--sos-soft);border-color:var(--sos);color:var(--sos)}
.dd-row input[type=date]{font:14px var(--f-body);padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:150px}
.near{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.near a{display:grid;gap:2px;padding:14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.near a b{font-size:15px}
.near a span{font-size:12px;color:var(--muted)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px 12px}

.sres{display:grid;gap:16px}
.sres h3{font-size:13px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.hit{display:grid;gap:2px;padding:12px 16px;text-decoration:none;color:var(--ink);border:0;background:none;text-align:left;width:100%;cursor:pointer}
.hit + .hit{border-top:1px solid var(--line)}
.hit b{font-size:15px}
.hit span{font-size:12px;color:var(--muted)}
.hit mark{background:var(--amber-soft);color:inherit;border-radius:2px}
.tool-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tool-quick a{display:grid;justify-items:center;gap:4px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:500;text-align:center;padding:10px 2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);line-height:1.3}

:root[data-theme="dark"] .tool-quick a b{color:var(--amber)}
.months{display:grid;gap:0;margin:0;padding:0;list-style:none}
.months li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:11px 16px;font-size:15px;align-items:baseline}
.months li + li{border-top:1px solid var(--line)}
.months li b{font:600 13px var(--f-mono);color:var(--muted)}
.gallery.one{grid-template-columns:1fr}
.gallery.one a{aspect-ratio:auto}
.gallery.one img{height:auto;object-fit:contain}
/* 마이플랜 다이렉트 */
.mp-hero{background:linear-gradient(160deg,#0B2E5C,#123E7A);color:#F3F6F9;border-radius:16px;padding:22px;display:grid;gap:10px;position:relative;overflow:hidden}

.mp-hero h1 em{font-style:normal;color:#3FE0F0}
.mp-hero p{font-size:15px;opacity:.9}
.mp-feats{display:grid;gap:8px}
.mp-feat{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mp-feat i{width:28px;height:28px;border-radius:8px;background:#E6FBFD;color:#0B2E5C;display:grid;place-items:center;flex:none;font-style:normal;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mp-feat i{background:#123E7A;color:#3FE0F0}}
:root[data-theme="dark"] .mp-feat i{background:#123E7A;color:#3FE0F0}
.mp-feat b{display:block;font-size:15px}
.mp-feat span{font-size:13px;color:var(--muted)}
.mp-fee{display:grid;gap:4px;padding:16px;border-radius:var(--r);background:var(--amber-soft);border:1.5px solid var(--amber)}
.mp-fee strong{font-family:var(--f-display);font-weight:400;font-size:22px}
.mp-fee span{font-size:13px;color:var(--muted)}
.guide{display:grid;gap:0}
.guide li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 16px;list-style:none}
.guide li + li{border-top:1px solid var(--line)}
.guide li > b{width:34px;height:34px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font:700 15px var(--f-mono)}
.guide h3{font-size:16px}
.guide p{font-size:14px;color:var(--muted)}
.guide ol{margin:0;padding:0}
.mp-card{display:flex;align-items:center;gap:14px;text-decoration:none;color:#F3F6F9;background:linear-gradient(135deg,#0B2E5C,#155096);border-radius:var(--r);padding:16px}

.mp-card small{font-size:11px;font-weight:700;letter-spacing:.08em;color:#3FE0F0}
.mp-card b{font-size:17px}
.mp-card span{font-size:13px;opacity:.85}
/* 유튜브 채널 카드 */
.yt-card{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:grid}
.yt-ban{height:92px;background:linear-gradient(120deg,#14324F 0%,#1E4C7A 55%,#C4302B 140%);position:relative;overflow:hidden}
.yt-ban::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(242,169,0,.9) 0 34px,transparent 34px 56px);height:5px;top:auto;bottom:0}
.yt-ban::after{content:"";position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%)}
.yt-ban .yt-mark{position:absolute;right:14px;top:12px;display:flex;align-items:center;gap:6px;color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;opacity:.95}
.yt-ban .yt-mark i{width:26px;height:18px;border-radius:5px;background:#FF0000;display:grid;place-items:center}
.yt-body{padding:0 16px 16px;display:grid;gap:12px;margin-top:-38px;position:relative}
.yt-top{display:flex;align-items:flex-end;gap:12px}
.yt-logo{width:76px;height:76px;border-radius:50%;background:#fff;border:3px solid var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden;flex:none;display:grid;place-items:center}
.yt-logo img{width:100%;height:100%;object-fit:contain}
.yt-sub-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--app);border:1px solid var(--line);margin-bottom:6px}
.yt-sub-badge b{width:8px;height:8px;border-radius:50%;background:#FF0000;display:inline-block}
.yt-name{display:grid;gap:3px}
.yt-name h2{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.25}
.yt-name p{font-size:14px;color:var(--muted)}
.yt-stats{display:flex;gap:6px;flex-wrap:wrap}
.yt-stats span{font:600 13px var(--f-body);padding:4px 10px;border-radius:6px;background:var(--app);border:1px solid var(--line)}
.yt-stats span em{font-style:normal;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.yt-btns{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.yt-subscribe{display:flex;align-items:center;justify-content:center;gap:8px;background:#CC0000;color:#fff;border-radius:999px;padding:13px 16px;font-weight:700;text-decoration:none;font-size:15px}
.yt-subscribe:hover{background:#B00000}
.yt-view{display:flex;align-items:center;justify-content:center;border-radius:999px;padding:13px 16px;font-weight:700;text-decoration:none;font-size:15px;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.yt-mini{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.yt-mini img{width:48px;height:48px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.yt-mini .t{flex:1;min-width:0;display:grid;gap:1px}
.yt-mini .t b{font-size:15px}
.yt-mini .t span{font-size:12px;color:var(--muted)}
.yt-mini .go{background:#CC0000;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}
/* 안내봇 */
.app{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 84px)}
.bot-fab{position:fixed;z-index:8;right:max(16px,calc(50% - 240px + 16px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);width:60px;height:60px;border-radius:50%;border:0;background:var(--amber);box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center;padding:0}

.bot-fab svg{width:46px;height:46px}
.bot-fab .eye{transform-origin:center;transform-box:fill-box}
@media (prefers-reduced-motion:no-preference){.bot-fab{animation:bob 3s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.bot-fab .eye{animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}}
.bot-tip{position:fixed;z-index:8;right:max(84px,calc(50% - 240px + 86px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 26px);max-width:min(240px,calc(100% - 110px));background:var(--surface);color:var(--ink);border:1.5px solid var(--amber);border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.15);cursor:pointer}
@media (max-width:480px){.bot-tip{right:max(84px,calc(env(safe-area-inset-right,0px) + 84px))}}
.bot-panel{position:fixed;z-index:9;right:max(12px,calc(50% - 240px + 12px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 10px);width:min(360px,calc(100% - 24px));max-height:min(560px,calc(100% - var(--tabh) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px) - 30px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.28);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
@media (max-width:480px){.bot-panel{right:max(12px,calc(env(safe-area-inset-right,0px) + 12px))}}
.bot-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--sign);color:var(--sign-ink)}
.bot-head svg{width:34px;height:34px;flex:none}
.bot-head .t{flex:1;min-width:0;display:grid}
.bot-head b{font-size:15px}
.bot-head span{font-size:12px;opacity:.8}
.bot-head button{background:none;border:0;color:inherit;font-size:26px;line-height:1;cursor:pointer;padding:2px 6px}
.bot-log{overflow-y:auto;padding:14px;display:grid;gap:10px;align-content:start;background:var(--app)}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-line}
.msg.bot{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px;justify-self:start}

.msg-acts{display:flex;flex-wrap:wrap;gap:6px;justify-self:start;max-width:100%}

.bot-chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;scrollbar-width:none;background:var(--surface)}
.bot-chips button{flex:none;font:600 12px var(--f-body);padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.bot-in{display:grid;background:var(--surface)}
.bot-form{display:flex;gap:8px;padding:10px 12px 12px}

.seg4{grid-template-columns:repeat(4,1fr);border-radius:12px}
.seg4 button{border-radius:9px;padding:10px 4px;font-size:14px}
.notice{display:grid;gap:8px;border-left:4px solid var(--amber)}
.notice .when{display:flex;flex-wrap:wrap;gap:6px}
.notice .when span{font:600 12px var(--f-mono);background:var(--amber-soft);border:1px solid var(--amber);border-radius:4px;padding:2px 7px}
.notice .past{background:var(--surface)!important;border-color:var(--line)!important;color:var(--muted)}
.notice b{font-size:17px}
.notice p{font-size:14px;color:var(--muted);white-space:pre-line}
.home-notice{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:var(--r);padding:14px 16px}
.home-notice .t{flex:1;min-width:0;display:grid;gap:2px}
.home-notice .t small{font-size:12px;font-weight:700;letter-spacing:.06em}
.home-notice .t b{font-size:15px;line-height:1.35}
.home-notice .t span{font:600 12px var(--f-mono);color:var(--muted)}
.news{display:grid;gap:3px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.news b{font-size:15px;line-height:1.4}
.news span{font-size:12px;color:var(--muted)}
.news p{font-size:13px;color:var(--muted)}
.site-g{display:grid;gap:8px}
.site-g h3{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.site .t b{font-size:15px}
.ext{font-size:12px;color:var(--muted);flex:none}
.search-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.search-links a{display:grid;place-items:center;padding:12px 6px;border:1.5px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;background:var(--surface);text-align:center}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:700;white-space:nowrap}

.wiz{display:grid;gap:18px}
.prog{display:grid;gap:8px}
.prog-bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}

.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;font-size:16px;font-weight:500;width:100%}
.opt[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft);font-weight:700}

.field label,.field .lb{font-weight:700;font-size:15px}

.err{color:var(--bad);font-size:14px;min-height:1.2em}
.okmsg{color:var(--ok);font-size:14px;min-height:1.2em}
.summary{display:grid;gap:6px;font-size:14px;margin:0}
.summary div{display:flex;gap:10px}

.done-ic{width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;margin:8px auto 0}

.intro{display:grid;gap:6px}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

.vrow .t b{font-size:15px;line-height:1.35}
.vrow .t span{font-size:12px;color:var(--muted)}

.lec-head b{font-size:17px}
.lec-head p{font-size:14px;color:var(--muted);white-space:pre-line}
.files{display:grid;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--app)}
.file .ft{font:600 11px var(--f-mono);background:var(--sign);color:var(--sign-ink);border-radius:4px;padding:3px 6px;flex:none}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}
.file .fs{font-size:12px;color:var(--muted);flex:none}

/* 후기 */
.rv{display:grid;gap:8px}
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rv-svc{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--amber-soft);border:1px solid var(--amber)}
.rv-d{font:600 12px var(--f-mono);color:var(--muted)}
.rv p{font-size:15px;white-space:pre-line}
.rv-who{font-size:13px;color:var(--muted)}

/* 관리 */
.admin-box{border:1.5px dashed var(--amber);border-radius:var(--r);padding:16px;display:grid;gap:14px;background:var(--surface)}
.admin-box h3{font-size:16px}
.admin-add{background:none;border:1.5px dashed var(--amber);border-radius:var(--r);padding:13px;font-weight:700;cursor:pointer;color:var(--ink);width:100%}
.del{background:none;border:0;color:var(--bad);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;justify-self:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flist{display:grid;gap:4px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.prog-bar i{transition:none}}

/* ===== 다듬기: 글꼴 · 통일된 표면 ===== */
@font-face{font-family:"Pretendard";font-weight:400;font-display:swap;src:url("assets/fonts/Pretendard-Regular.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:500;font-display:swap;src:url("assets/fonts/Pretendard-Medium.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:600;font-display:swap;src:url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:700;font-display:swap;src:url("assets/fonts/Pretendard-Bold.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:800 900;font-display:swap;src:url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2")}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;letter-spacing:-.01em;font-size:16px}
h1,h2,h3{letter-spacing:-.025em}
.top-title,.hero h1,.intro h1,.rainbow b,.cal-hero h1,.mp-hero h1,.yt-name h2,.mp-fee strong,.vthumb .vt,.group-label b{font-weight:800;letter-spacing:-.03em}
.top-title{font-size:18px}
.hero h1{font-size:30px;line-height:1.22}
.intro h1{font-size:26px}
.sec-t h2{font-size:19px;font-weight:700}
.sec-t a{font-weight:600}
.call strong,.dial-btn strong,.ins-row strong,.stock strong,.result .big strong,.result dd,.plate input,.dd,.step b,.prog small,.rv-d,.lec-head .d,.notice .when span,.home-notice .t span,.dd-row .t span,.file .ft,.yt-stats span em,.tool-quick a b,.guide li>b,.months li b,.sos-steps li::before{font-family:var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.call strong,.dial-btn strong,.ins-row strong,.stock strong,.result .big strong{font-weight:800}
.plate input{font-weight:800;letter-spacing:.04em}
/* 표면 통일 */
.app{background:var(--app)}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(15,39,65,.12)}}
.screen{gap:24px;padding-block:22px 8px}
.card,.rows,.yt-card,.empty,.mp-feat,.stock div,.near a,.dial-btn,.tool-quick a,.fault,.home-notice,.yt-mini,.info-row{border:0!important;box-shadow:var(--sh);border-radius:16px}
.empty{background:var(--surface)}
.rows{overflow:hidden}
.row + .row,.req + .req,.hit + .hit,.ins-row + .ins-row,.dd-row + .dd-row,.guide li + li,.months li + li,#homeRooms > div + div,#roomList > div + div,.dyn-rows > div + div{border-top:1px solid var(--line)}
.row{padding:16px 18px}
.row .ic{background:var(--app);border-radius:12px}
.chev{font-size:18px;opacity:.6}
.qi{border:0;box-shadow:var(--sh);border-radius:16px;background:var(--surface)}
.quick a{font-weight:600}
.top{box-shadow:0 1px 0 rgba(255,255,255,.04),0 6px 20px rgba(8,20,35,.18)}
.tabs{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line)}
.tabs a{font-weight:600}
.hero{border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,rgba(230,164,25,.18),transparent 55%),linear-gradient(160deg,var(--sign),#0A1C30);padding:24px 22px 28px}
.hero::after{height:4px;opacity:.9}
.hero .kicker{letter-spacing:.06em;font-size:12px}
/* 세그먼트: 한 줄, 고급 스타일 */
.seg{background:var(--seg);border:0;border-radius:14px;padding:4px;gap:2px}
.seg button{border-radius:10px;color:var(--muted);font-weight:600;padding:10px 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,39,65,.12)}
.seg.seg4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.seg4 button{font-size:14px}
.chipbar button,.tool-tabs button,.bot-chips button{border:0;background:var(--seg);color:var(--muted);font-weight:600}
.chipbar button[aria-pressed="true"],.tool-tabs button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink)}
/* 버튼 */
.btn{border-radius:14px;font-weight:700;letter-spacing:-.01em}
.btn-amber{background:var(--amber);color:var(--amber-ink);box-shadow:0 6px 16px rgba(230,164,25,.25)}
.btn-line{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.pill-btn{font-weight:700;padding:8px 14px}
.copy{border:0;background:var(--seg);border-radius:10px;font-weight:600}
.admin-add{border-radius:14px;background:transparent;font-weight:600}
/* 강조 카드 차분하게 */
.sos-card{background:var(--surface);color:var(--ink);box-shadow:var(--sh);border-radius:16px}
.sos-card .ic{background:var(--sos-soft);color:var(--sos)}
.sos-card .t b{color:var(--sos)}
.sos-card .t span{color:var(--muted);opacity:1}
.sos-card .chev{color:var(--muted)!important}
.mp-card{border-radius:16px;background:radial-gradient(120% 160% at 100% 0%,rgba(63,224,240,.18),transparent 55%),linear-gradient(140deg,#0B2E5C,#0F3D73);box-shadow:var(--sh)}
.rainbow{padding:2px;border-radius:18px;box-shadow:var(--sh)}
.rainbow .rb-in{border-radius:16px;padding:20px}
.rainbow b{font-size:23px}
.home-notice{background:var(--surface)}
.home-notice .t small{color:var(--amber)}
.mp-fee{border:0;box-shadow:var(--sh);border-radius:16px;background:var(--surface);border-left:4px solid var(--amber)!important}
.notice{border-left:4px solid var(--amber)!important}
.dial-btn.hot{box-shadow:0 6px 16px rgba(200,40,30,.22)}
.yt-ban{height:96px}
.yt-logo{border-color:var(--surface)}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:12px;background:var(--app)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 25%,transparent);background:var(--surface)}
.opt{border:1px solid var(--line);border-radius:14px;box-shadow:none}
.opt[aria-pressed="true"]{border-color:var(--amber)}
.admin-box{border-radius:16px}
.vthumb{border-radius:16px}
.cthumb{border:0;box-shadow:var(--sh);border-radius:12px}
.bot-panel{border:0;border-radius:20px}

/* ===== 반응형 · 파랑/흰색 카드 시스템 ===== */
.app{max-width:none;box-shadow:none!important;background:var(--app)}
main.gut{max-width:1200px;margin:0 auto}
.top .gut{max-width:1200px;margin:0 auto;height:64px;gap:14px}
.top{background:linear-gradient(180deg,#0A2C66,#0B3275)}
.top-title{text-decoration:none;color:inherit;flex:0 1 auto}
.top-title i{background:linear-gradient(135deg,#7FB2FF,#FFFFFF);transform:rotate(45deg);border-radius:3px}
.top-nav{display:none;flex:1;gap:4px;justify-content:center}
.top-nav a{color:rgba(255,255,255,.82);text-decoration:none;font-size:15px;font-weight:600;padding:8px 12px;border-radius:10px;white-space:nowrap}
.top-nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.top-nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.14)}
.top-nav a.nav-sos{color:#FFB4AC}
.top-phone{display:none;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.top .pill-btn{background:#FFFFFF;color:#0A2C66;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.admin-chip{border-color:rgba(255,255,255,.5);color:#fff}
.icon-btn{color:#fff}
/* 공통 카드 */
.card,.rows,.yt-card,.empty,.mp-feat,.stock div,.near a,.dial-btn,.tool-quick a,.fault,.home-notice,.yt-mini,.sos-card,.hcard,.result{border:1px solid var(--line)!important;box-shadow:var(--sh);border-radius:20px}
.card,.empty,.mp-feat,.stock div,.near a,.tool-quick a,.home-notice,.yt-mini,.sos-card,.hcard,.rows{background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%)}
.card{padding:22px}
.rows{border-radius:20px}
.result{border:0!important;background:linear-gradient(150deg,#0A2C66,#1D5BD8);box-shadow:0 12px 28px -10px rgba(29,91,216,.45)}
.result .big strong{color:#fff}
.dial-btn.hot{border-color:transparent!important}
.qi{border:1px solid var(--line)!important;background:var(--tile)!important;color:var(--amber)!important;width:56px;height:56px;border-radius:18px;box-shadow:0 1px 2px rgba(13,40,90,.05),0 8px 18px -8px rgba(29,91,216,.35)}
.qi svg{width:28px;height:28px}
.sec-t{margin-bottom:14px}
.sec-t h2{font-size:21px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.sec-t h2::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--blue-2),var(--amber))}
.sec-t a{color:var(--amber);font-weight:700;font-size:14px;text-decoration:none}
.intro h1{font-size:28px}
.intro h1::after{content:"";display:block;width:44px;height:4px;border-radius:2px;margin-top:12px;background:linear-gradient(90deg,var(--amber),var(--blue-2))}
.btn-amber{background:linear-gradient(180deg,#2B6BEA,#1D5BD8);color:#fff;box-shadow:0 8px 18px -6px rgba(29,91,216,.55)}
.btn-amber:hover{filter:brightness(1.05)}
.btn{min-height:52px;font-size:16px}
.copy{min-height:40px}
.row{min-height:60px}
.row .ic{background:var(--tile);color:var(--amber);width:44px;height:44px;border-radius:14px}
.row .ic svg{width:24px;height:24px}
.row:hover{background:var(--amber-soft)}
.draft{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
/* 마우스 올리면 살짝 떠오르기 */
.hcard,.sos-card,.mp-card,.yt-mini,.tool-quick a,.near a,.dial-btn,.home-notice,.vcard,.cthumb,.fault,.quick a,.yt-card,.rainbow,.mp-feat,.lec,.rv,.notice{transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease,border-color .22s ease}
@media (hover:hover){
  .hcard:hover,.sos-card:hover,.mp-card:hover,.yt-mini:hover,.tool-quick a:hover,.near a:hover,.dial-btn:hover,.home-notice:hover,.fault:hover,.yt-card:hover,.rainbow:hover,.mp-feat:hover,.lec:hover,.rv:hover,.notice:hover{transform:translateY(-4px);box-shadow:var(--sh-h);border-color:color-mix(in srgb,var(--amber) 28%,var(--line))!important}
  .cthumb:hover,.vcard:hover .vthumb{transform:translateY(-3px);box-shadow:var(--sh-h)}
  .quick a:hover{background:transparent;transform:translateY(-3px)}
}
@media (prefers-reduced-motion:reduce){.hcard,.sos-card,.mp-card,.yt-mini,.tool-quick a,.near a,.dial-btn,.home-notice,.vcard,.cthumb,.fault,.quick a,.yt-card,.rainbow,.mp-feat,.lec,.rv,.notice{transition:none;transform:none!important}}
/* 히어로 */
.hero{background:radial-gradient(110% 120% at 100% 0%,rgba(94,160,255,.35),transparent 55%),linear-gradient(155deg,#0A2C66 0%,#123F92 60%,#1D5BD8 100%);border-radius:28px;box-shadow:0 24px 50px -24px rgba(10,44,102,.6)}
.hero::after{display:none}
.hero h1 em{color:#9CC4FF}
.hero .kicker{color:#BFD7FF}
.hero-x{display:grid;gap:22px;padding:26px 22px}
.hero-txt{display:grid;gap:12px;align-content:center;min-width:0}
.hero-x h1{font-size:clamp(30px,5.4vw,48px);line-height:1.16}
.hero-x p{font-size:clamp(15px,1.6vw,18px);opacity:.92;max-width:34em}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.hero-cta .btn{width:auto;flex:1 1 180px}
.btn-white{background:#fff;color:#0A2C66;box-shadow:0 10px 22px -8px rgba(0,0,0,.35)}
.btn-ghost-w{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.btn-ghost-w:hover{background:rgba(255,255,255,.16)}
.hero-pic{min-width:0}
.hero-art{width:100%;height:auto;display:block;border-radius:22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.55)}
/* 홈 핵심 카드 */
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.hcard{position:relative;padding:24px 22px 22px;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:6px;min-width:0;overflow:hidden}
.hcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--amber),var(--blue-2));opacity:.85}
.hc-ic{width:60px;height:60px;border-radius:18px;background:var(--tile);color:var(--amber);display:grid;place-items:center;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 10px 20px -10px rgba(29,91,216,.45)}
.hc-ic svg{width:30px;height:30px}
.hcard small{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--amber)}
.hcard h3{font-size:20px;font-weight:800;letter-spacing:-.03em}
.hcard p{font-size:15px;color:var(--muted);line-height:1.6;margin-top:2px}
.hc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hc-b1,.hc-b2{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:12px;font:700 15px var(--f-body);text-decoration:none;cursor:pointer;flex:1 1 auto}
.hc-b1{background:linear-gradient(180deg,#2B6BEA,#1D5BD8);color:#fff;border:0;box-shadow:0 6px 14px -6px rgba(29,91,216,.6)}
.hc-b2{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.hc-b2:hover{border-color:var(--amber);color:var(--amber)}
.hc-sos .hc-ic{background:linear-gradient(145deg,#FFF1EF,#FFDCD7);color:var(--sos)}
.hc-sos::before{background:linear-gradient(90deg,var(--sos),#FF8A7A)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hc-sos .hc-ic{background:linear-gradient(145deg,#3A1715,#4A1C19)}}
:root[data-theme="dark"] .hc-sos .hc-ic{background:linear-gradient(145deg,#3A1715,#4A1C19)}
/* 기타 블록 톤 맞춤 */
.mp-card{background:radial-gradient(120% 160% at 100% 0%,rgba(94,160,255,.3),transparent 55%),linear-gradient(140deg,#0A2C66,#1A4FB8);border:0!important}
.mp-hero{background:radial-gradient(120% 160% at 100% 0%,rgba(94,160,255,.3),transparent 55%),linear-gradient(150deg,#0A2C66,#1A4FB8);border-radius:24px}
.mp-feat i{background:var(--tile);color:var(--amber)}
.mp-fee{border-left-color:var(--amber)!important}
.home-notice .t small{color:var(--amber)}
.sos-card .ic{width:52px;height:52px}
.yt-ban{background:linear-gradient(120deg,#0A2C66 0%,#1D5BD8 60%,#C4302B 150%)}
.yt-ban::before{background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 34px,transparent 34px 56px)}
.seg button[aria-pressed="true"]{color:var(--amber)}
.chipbar button[aria-pressed="true"],.tool-tabs button[aria-pressed="true"]{background:var(--amber);color:#fff}
.lb-nav button{border-radius:12px}
.opt[aria-pressed="true"]{background:var(--amber-soft)}
.opt[aria-pressed="true"] .ck{color:#fff}
.prog-bar i{background:linear-gradient(90deg,var(--amber),var(--blue-2))}
.step b{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.guide li>b{background:var(--amber);color:#fff}
.fault .ratio{background:linear-gradient(150deg,#0A2C66,#1D5BD8)}
.bot-fab{background:linear-gradient(150deg,#FFFFFF,#E6EEFC);border:1px solid var(--line)}
.bot-form button{color:#fff}
/* 하단 탭 + 가운데 전화 버튼 */
.tabs{grid-template-columns:repeat(5,1fr);align-items:end;box-shadow:0 -8px 24px -12px rgba(13,40,90,.18)}
.tab-call{position:relative;color:var(--amber)!important;font-weight:800!important}
.tab-call span{width:58px;height:58px;margin-top:-26px;border-radius:50%;background:linear-gradient(160deg,#2F74F0,#1A4FB8);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -6px rgba(29,91,216,.65),0 0 0 5px var(--surface)}
.tab-call span svg{width:26px;height:26px}
@media (prefers-reduced-motion:no-preference){.tab-call span{animation:ring 3.2s ease-in-out infinite}@keyframes ring{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-12deg)}92%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(5,12,25,.5);backdrop-filter:blur(2px)}
.sheet{position:fixed;z-index:31;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);background:var(--surface);border-radius:24px 24px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:12px;box-shadow:0 -20px 50px rgba(0,0,0,.25)}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheet h2{font-size:20px;font-weight:800}
.sheet-num{font:800 34px var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--amber);user-select:all}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-links{display:flex;gap:16px;flex-wrap:wrap}
.sheet-links a{color:var(--ink);font-weight:600;font-size:15px}
.sheet-x{background:none;border:0;color:var(--muted);font-weight:600;padding:8px;cursor:pointer}
@media (min-width:960px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:24px;width:440px}.sheet-grip{display:none}}
/* 화면 폭별 배치 */
.screen:not([data-screen="home"]):not([data-screen="services"]):not([data-screen="learn"]):not([data-screen="comics"]):not([data-screen="cases"]):not([data-screen="reviews"]):not([data-screen="info"]):not([data-screen="tools"]):not([data-screen="myplan"]){max-width:960px;margin-inline:auto;width:100%}
.screen > *{min-width:0}
#homeNotice:empty,#rainbowBox:empty{display:none}
@media (min-width:640px){
  .quick{grid-template-columns:repeat(8,minmax(0,1fr))}
  .dial{grid-template-columns:repeat(3,minmax(0,1fr))}.dial-btn.wide{grid-column:auto}
  .near{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}

}
@media (min-width:760px){
  .hero-x{grid-template-columns:1.05fr 1fr;padding:40px;align-items:center}
  .vlist,#caseList,#reviewList,#panelLectures,#panelLreviews,#panelNotices,.mp-feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;align-items:start}
  #panelVideos .vlist{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  #panelLectures>.admin-add,#panelLectures>.admin-box,#panelLectures>.empty,#panelNotices>.admin-add,#panelNotices>.admin-box,#panelNotices>.empty,#panelNotices>.sec-t,#panelLreviews>.admin-add,#panelLreviews>.admin-box,#panelLreviews>.empty{grid-column:1/-1}
  .screen[data-screen="services"] .rows{display:grid;grid-template-columns:1fr 1fr}
  .screen[data-screen="services"] .rows .row + .row{border-top:0}
  .screen[data-screen="services"] .rows .row{border-bottom:1px solid var(--line)}

.bot-fab2::before{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;z-index:-1;animation:bfPulse 2.4s ease-out infinite}
.bot-fab2 .bf-shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.bot-fab2 .bf-shine::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:bfShine 3.6s ease-in-out infinite}

.bot-fab2:hover{animation-play-state:paused!important;transform:translateY(-4px) scale(1.04)}

@keyframes bfFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

@media (prefers-reduced-motion:reduce){.bot-fab2,.bot-fab2::before,.bot-fab2 img,.bot-fab2 .bf-txt b,.bot-fab2 .bf-dot,.bot-fab2 .bf-shine::after{animation:none!important}}

        <h1>27년 한 해 목표,<br>정하셨나요?</h1>
        <p>27년 설계사에게 가장 중요한 질문은 이것 같습니다.</p>
        <blockquote>“수수료가 4년에 나눠 들어와도<br class="m-br"> 버틸 수 있는가?”</blockquote>
      </div>
      <div class="ac-story">
        <p>많이 팔아서 버티는 방식은 이제 한계가 옵니다.<br>고객에게 “가입시켜준 사람, 청구해주는 사람”이 아니라<br><mark>“사고 나면 먼저 전화하는 사람”</mark>으로 기억되면 어떨까요?</p>
        <p>그 변화를 가장 빨리 만들 수 있는 게 <b>자동차보험</b>입니다.<br>갱신은 해마다 돌아오고, 사고는 예고 없이 발생하니까요.<br>그때 과실비율과 합의금 흐름을 짚어주면 <b>신뢰</b>가 생기고,<br>그 신뢰가 <b>계약과 소개</b>로 이어집니다.</p>

        <span class="ac-kick dark">자동차보상전문가 25주 과정</span>
        <h1>1기 수강생들의<br><em>역대급 후기</em>가 증명합니다.</h1>
      </div>
      <figure class="ac-best"><svg class="ac-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg><blockquote>29년차 제 인생에서 25주차 강의를 참여한 게<br class="pc-br"> 가장 잘했다 생각이 듭니다</blockquote><figcaption>1기 수강생</figcaption></figure>
      <ul class="ac-quotes"><li>“대표님 말씀처럼 입밖으로 뱉었더니 확실히 효과가 바로 오더라구요”</li><li>“알면 알수록 깊어지는 강의”</li><li>“보상을 아는 사람과 모르는 사람은 분명 격이 다르다”</li><li>“실제 보상사례와 연결해 이해하니 안보이던 부분들이 보이기 시작했습니다”</li><li>“매주 강의를 듣는데도 어쩜 이렇게 새로운 내용이 계속 나오는지!!!”</li></ul>
      <div class="x-h t-study"><h2><i class="x-dot"></i>7주차 후기 중에서</h2><span class="x-sub">수강생 단톡방에 올라온 후기를 그대로 옮겼어요 (일부 발췌)</span></div>
      <div class="ac-revs"><article class="ac-rv"><p>처음에는 알고 있다고 생각했던 내용들도 반복해서 배우고, 실제 보상 사례와 연결해 이해하다 보니 그동안 미처 생각하지 못했던 부분들이 하나둘 보이기 시작했습니다.</p><span>1기 수강생 · 7주차 후기</span></article><article class="ac-rv"><p>단순히 복습만 하는 게 아니라 그동안 배운 내용에 새로운 지식까지 더해주시니 알면 알수록 깊어지는 강의시간이었습니다.</p><span>1기 수강생 · 7주차 후기</span></article><article class="ac-rv"><p>배운걸 토대로 자유자재로 설계창을 만져보고 제안할 수 있다고 생각하니 신납니다.</p><span>1기 수강생 · 7주차 후기</span></article><article class="ac-rv"><p>지난 6주동안 모든 담보들을 배우고 다시 한번 더 기억을 더듬어보며 복습하는 시간이 많이 유익했습니다. 앞으로 현장에서 자동차보험을 명확하게 알고 보상을 해주는 사람과 그렇지 않은 사람은 분명 격이 다른 차이를 보여 줄 것이라고 생각이 듭니다.</p><span>1기 수강생 · 7주차 후기</span></article><article class="ac-rv"><p>제가 배운 지식으로 고객님들께 실질적인 도움을 드릴 수 있다는 보람과 함께, 거기서 얻은 자신감으로 영업에 큰 도움이 되어 실적에도 좋은 영향이 있었습니다.</p><span>1기 수강생 · 7주차 후기</span></article><article class="ac-rv"><p>대표님 말씀처럼 입밖으로 뱉어보려 노력하고 있는데 뱉었더니 확실히 효과가 바로 오더라고요.</p><span>1기 수강생 · 7주차 후기</span></article><article class="ac-rv"><p>그 사이사이 특별한 경험과 노하우로 수강생들을 홀리는 마법과 같은 실전 사례를 가감없이 풀어주는 대표님께 다시 한번 더 홀리홀리해지는 매력 넘치는 시간이었습니다.</p><span>1기 수강생 · 7주차 후기</span></article><article class="ac-rv"><p>저도 모르게 단전에서부터 “아니~ 도대체 이런 걸 어떻게 아시는 거세요” 라는 말이 나온 수업이었습니다.</p><span>1기 수강생 · 7주차 후기</span></article><article class="ac-rv"><p>혼자서는 놓치기 쉬운 내용들을 하나하나 짚어가며 정리해 주셔서 정말 좋았습니다.</p><span>1기 수강생 · 7주차 후기</span></article></div>

    <section class="screen" data-screen="faq" data-title="자주 묻는 질문" hidden>
      <div class="fq-head"><h1>자주 묻는 질문</h1><p>궁금한 질문을 누르면 답이 펼쳐집니다</p></div>
      <div class="rows fq">
        <details><summary>장기렌트와 리스는 어떻게 다른가요?</summary><p>장기렌트는 차 명의가 렌터카 회사에 있고 보험료가 월 대여료에 들어갑니다. 운용리스는 명의가 리스 회사에 있고 보험은 이용자가 직접 가입합니다. 렌트·리스 화면의 비교표를 참고해 주세요.</p></details>
        <details><summary>여러 서비스를 한 번에 상담받을 수 있나요?</summary><p>네. 예를 들어 타던 차 판매와 새 차 장기렌트를 함께 상담할 수 있습니다. 신청서 마지막 칸에 함께 적어 주세요.</p></details>
        <details><summary>차를 팔 때 어떤 서류가 필요한가요?</summary><p>개인 판매는 보통 자동차등록증, 신분증, 매도용 인감증명서가 필요합니다. 상황에 따라 달라질 수 있어 상담 때 확인해 드립니다.</p></details>
        <details><summary>자동차 강의는 어디서 보나요?</summary><p>아래 탭의 '강의'에서 유튜브 강의 영상과 강의 자료를 볼 수 있습니다. 영상은 유튜브에서 열립니다.</p></details>
        <details><summary>신청하면 언제 연락이 오나요?</summary><p>상담시간(월~토 08:00~20:00, 일요일 휴무) 안에 남겨 주신 연락처로 전화드립니다.</p></details>
        <details><summary>자동차보험은 언제 비교하는 게 좋나요?</summary><p>만기 30일 전쯤 갱신 안내가 오면 바로 비교하는 것이 좋습니다. 만기 전에 가입해 두어야 보장 공백이 생기지 않습니다.</p></details>
        <details><summary>설계사인데 고객 자동차보험을 다이렉트로 맡길 수 있나요?</summary><p>네. 마이플랜 다이렉트에 고객 정보를 보내 주시면 비교 견적 후 체결까지 진행하고, 체결 수수료는 익일 지급됩니다. 자세한 절차는 '이용 가이드'를 보세요.</p></details>
        <details><summary>사고가 나면 무엇부터 해야 하나요?</summary><p>사람의 안전을 먼저 챙기고, 다친 사람이 있으면 119, 사고 처리는 112에 신고합니다. 그다음 내 보험사에 사고 접수를 합니다. '사고 접수' 화면에 순서와 보험사 번호가 있습니다.</p></details>
      </div>

  const next=JSON.parse(JSON.stringify(DATA));mutate(next);
  msgEl.className="okmsg";msgEl.textContent="저장하는 중입니다…";
  try{await ART.publish(buildPage(next));msgEl.textContent="저장했습니다. 화면을 새로 불러옵니다.";return true}
  catch(e){
    const c=e&&e.code;msgEl.className="err";
    if(c==="conflict")msgEl.textContent="다른 곳에서 먼저 저장되어 최신 내용으로 다시 불러옵니다. 다시 입력해 주세요.";
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"){msgEl.textContent="이 계정은 보기 전용이라 저장할 수 없습니다.";setAdmin(false)}
    else if(c==="too_large")msgEl.textContent="내용이 너무 많아 저장할 수 없습니다. 오래된 항목을 정리해 주세요.";
    else if(c==="rate_limited")msgEl.textContent="저장이 너무 잦습니다. 잠시 후 다시 눌러 주세요.";
    else msgEl.textContent="저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    return false;
  }
}

function ytId(url){

  const m=s.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);

}

const RV_COLOR={"다이렉트 보험·보상":"#2563EB","장기렌트":"#7C3AED","리스":"#0EA5E9","신차 구매":"#059669","수입차 구매 대행":"#DB2777","중고차 판매":"#EA580C","직거래·매입":"#CA8A04","정비·점검":"#475569"};
let rvFilter="전체";
function renderRvDash(revs){
  const n=revs.length,avg=n?(revs.reduce((a,r)=>a+(r.star||5),0)/n).toFixed(1):"-";
  const by={};revs.forEach(r=>by[r.service]=(by[r.service]||0)+1);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  const month=revs.filter(r=>String(r.date||"").slice(0,7)===today().slice(0,7)).length;
  $("#rvStats").innerHTML=`<div class="rvs s1"><small>전체 후기</small><b>${n}<em>건</em></b></div><div class="rvs s2"><small>평균 만족도</small><b>${avg}<em>/ 5</em></b></div><div class="rvs s3"><small>이번 달 후기</small><b>${month}<em>건</em></b></div><div class="rvs s4"><small>후기 많은 서비스</small><b class="sm">${top?esc(top[0]):"-"}</b></div>`;
  $("#rvChips").innerHTML=["전체",...REVIEW_SVCS].map(c=>`<button type="button" aria-pressed="${rvFilter===c}" data-rvf="${esc(c)}" style="--c:${RV_COLOR[c]||"#0A2C66"}">${esc(c)} <em>${c==="전체"?n:(by[c]||0)}</em></button>`).join("");
  const shown=rvFilter==="전체"?revs:revs.filter(r=>r.service===rvFilter);
  const slots=Math.max(0,8-shown.length);
  const add=`<button type="button" class="rvc rvc-add" data-rvadd><span class="rva-ic"><svg class="xi" viewBox="0 0 24 24" width="26" height="26"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg></span><b>${ADMIN?"+ 새 후기 올리기":"후기 보내기"}</b><span>${ADMIN?"고객님이 보내 주신 후기를 이 칸에 올려 주세요":"상담·보상 경험을 문자로 보내 주시면 동의 확인 후 올려 드립니다"}</span></button>`;
  const empties=Array.from({length:Math.max(0,slots-1)},(_,i)=>`<div class="rvc rvc-empty"><span class="rve-n">${shown.length+i+2}</span><b>후기 자리</b><span>새 후기가 올라오면 여기에 표시됩니다</span></div>`).join("");
  $("#reviewList").innerHTML=add+shown.map(reviewCard).join("")+empties;
  document.querySelectorAll("[data-rvf]").forEach(b=>b.onclick=()=>{rvFilter=b.dataset.rvf;renderRvDash(revs);bindAdmin()});
  document.querySelectorAll("[data-rvadd]").forEach(b=>b.onclick=()=>{if(ADMIN){openForm="review";renderContent();const f=$("#reviewAdmin");if(f)f.scrollIntoView({behavior:"smooth",block:"start"})}else{location.href="sms:01057428603?body="+encodeURIComponent("[마이플랜 다이렉트 후기]\n이름(표시용): \n서비스: \n후기 내용: \n게시 동의: 예")}});
}

}

const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,""));return isNaN(n)?0:n};

function calcLoan(){
  const price=num($("#lnPrice").value),down=Math.min(num($("#lnDown").value),price),rate=num($("#lnRate").value)/100/12,n=+$("#lnMonths").value;
  const P=price-down;let M=0;
  if(P>0)M=rate>0?P*rate*Math.pow(1+rate,n)/(Math.pow(1+rate,n)-1):P/n;
  const total=M*n;
  $("#lnOut").innerHTML=P>0?`<div class="big"><span>매달 내는 돈</span><strong>${won(M)}</strong></div><dl><div><dt>할부 원금</dt><dd>${won(P)}</dd></div><div><dt>총 이자</dt><dd>${won(total-P)}</dd></div><div><dt>총 납입액 (선수금 제외)</dt><dd>${won(total)}</dd></div></dl>`:`<div class="big"><span>할부 원금이 없습니다</span><strong>0원</strong></div>`;
}
function calcTax(){
  const ev=$("#txFuel").value==="ev";$("#txCcWrap").hidden=ev;$("#txYearWrap").hidden=ev;
  let base,cut=0,rateTxt="";
  if(ev){base=100000;rateTxt="전기차 정액"}
  else{const cc=num($("#txCc").value);const per=cc<=1000?80:cc<=1600?140:200;base=cc*per;rateTxt=`cc당 ${per}원 × ${cc.toLocaleString("ko-KR")}cc`;
    const y=parseInt($("#txYear").value,10);const age=y>1950?new Date().getFullYear()-y+1:1;cut=Math.min(50,Math.max(0,(age-2)*5));
    rateTxt+=` · 차령 ${Math.max(age,1)}년차${cut?" · "+cut+"% 경감":""}`}
  const tax=Math.floor(base*(100-cut)/100),edu=Math.floor(tax*0.3);
  $("#txOut").innerHTML=`<div class="big"><span>1년 자동차세 (합계)</span><strong>${won(tax+edu)}</strong></div><dl><div><dt>자동차세</dt><dd>${won(tax)}</dd></div><div><dt>지방교육세 (30%)</dt><dd>${won(edu)}</dd></div><div><dt>6월·12월 나눠 낼 때</dt><dd>각 ${won((tax+edu)/2)}</dd></div></dl><span class="small" style="opacity:.8">${esc(rateTxt)}</span>`;
}

function botMsg(text,who,acts){const log=$("#botLog");const d=document.createElement("div");d.className="msg "+(who||"bot");d.textContent=text;log.appendChild(d);
  if(acts&&acts.length){const a=document.createElement("div");a.className="msg-acts";acts.forEach(([l,href,tool])=>{const el=document.createElement("a");el.textContent=l;
      if(href==="yt"){const u=DATA.channel?(DATA.channel+(DATA.channel.indexOf("?")>-1?"&":"?")+"sub_confirmation=1"):"#learn";el.href=u;if(DATA.channel){el.target="_blank";el.rel="noopener"}}
      else if(/^https?:/.test(href)){el.href=href;el.target="_blank";el.rel="noopener"}
      else{el.href=href;el.addEventListener("click",()=>{if(tool)setTimeout(()=>showTool(tool),0);if(matchMedia("(max-width:480px)").matches)botClose()})}
      a.appendChild(el)});log.appendChild(a)}
  log.scrollTop=log.scrollHeight}
function botAnswer(q){
  const ql=q.toLowerCase().replace(/\s+/g," ");
  let best=null,score=0;
  BOT_KB.forEach(e=>{const sc=e.k.reduce((n,w)=>n+(ql.includes(w.toLowerCase())?w.length:0),0);if(sc>score){score=sc;best=e}});
  if(best){botMsg(best.a(),"bot",best.acts);return}
  const hits=searchIndex().filter(x=>(x.title+" "+x.sub+" "+(x.body||"")).toLowerCase().includes(ql.trim())).slice(0,3);
  if(hits.length){botMsg("관련된 내용을 찾았어요.","bot",hits.map(h=>[h.title.length>18?h.title.slice(0,18)+"…":h.title,h.ext?h.href:h.href]));return}
  botMsg("죄송해요, 사이트에서 그 내용을 찾지 못했어요. 전화로 물어보시면 자세히 안내해 드립니다.\n"+PHONE,"bot",[["상담 신청","#consult"]]);
}

  setTimeout(()=>$("#botQ").focus(),50)}

function renderLoc(){
  const out=$("#locOut"),btns=$("#locBtns");
  if(!CAN_EMBED||!navigator.geolocation){
    $("#locHelp").textContent="지도 앱에서 내 위치를 눌러 공유하거나, 아래 버튼으로 지도 앱을 열어 현재 위치를 확인하세요.";
    out.textContent="";
    btns.innerHTML=`<a class="btn btn-amber" href="https://map.naver.com/p/" target="_blank" rel="noopener">지도 앱 열기</a><a class="btn btn-line" href="#accident">사고 접수 화면</a>`;
    return;
  }
  if(!myPos){btns.innerHTML=`<button class="btn btn-amber" type="button" id="locGet">내 위치 찾기</button><a class="btn btn-line" href="#accident">사고 접수 화면</a>`;
    $("#locGet").onclick=()=>{out.textContent="위치를 확인하는 중…";navigator.geolocation.getCurrentPosition(p=>{myPos={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};renderMap()},e=>{out.textContent=e.code===1?"위치 사용이 허용되지 않았습니다. 휴대폰 설정에서 위치를 켜 주세요.":"위치를 찾지 못했습니다. 잠시 후 다시 눌러 주세요."},{enableHighAccuracy:true,timeout:12000})};return}
  const link=`https://www.google.com/maps?q=${myPos.lat},${myPos.lng}`;
  out.textContent=`현재 위치: ${myPos.lat}, ${myPos.lng}`;
  const body=encodeURIComponent(`[마이플랜 다이렉트] 사고 위치 알림\n${link}`);
  btns.innerHTML=`<a class="btn btn-amber" href="sms:01057428603?body=${body}">담당자에게 문자</a><button class="btn btn-line" type="button" id="locCopy">위치 링크 복사</button>`;
  $("#locCopy").onclick=()=>{const b=$("#locCopy");(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(link):Promise.reject()).then(()=>{b.textContent="복사됨"},()=>{out.textContent=link;b.textContent="위 링크를 길게 눌러 복사"})};
}

async function pdfToImages(src,prog){const lib=await loadPdfJs();const data=src instanceof Blob?new Uint8Array(await src.arrayBuffer()):src;const doc=await lib.getDocument({data}).promise;const out=[];
  for(let n=1;n<=doc.numPages;n++){prog&&prog(n,doc.numPages);const pg=await doc.getPage(n);const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:1100/vp0.width});const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.8)))}

/* ---------- 지도 그림 (실제 지도 느낌) ---------- */
function cityMapSVG(W,H,seed){
  let x=seed||7;const R=()=>{x=(x*16807)%2147483647;return (x-1)/2147483646};
  const o=[];o.push(`<rect class="m-land" width="${W}" height="${H}"/>`);
  const ry=H*0.68;
  const river=`M-20 ${ry} C${W*.18} ${ry-50} ${W*.32} ${ry+40} ${W*.5} ${ry+6} C${W*.68} ${ry-28} ${W*.82} ${ry+30} ${W+20} ${ry-18}`;
  // parks
  [[.62,.1,.17,.2],[.08,.12,.12,.14],[.3,.48,.1,.1]].forEach(([a,b,c,d])=>o.push(`<rect class="m-park" x="${W*a}" y="${H*b}" width="${W*c}" height="${H*d}" rx="14"/>`));
  // streets grid
  const hs=[],vs=[];let yy=18+R()*20;while(yy<H){hs.push(yy);yy+=34+R()*36}let xx=14+R()*20;while(xx<W){vs.push(xx);xx+=38+R()*42}
  // buildings in blocks
  for(let a=0;a<hs.length-1;a++)for(let b=0;b<vs.length-1;b++){const x0=vs[b]+6,x1=vs[b+1]-6,y0=hs[a]+6,y1=hs[a+1]-6;if(x1-x0<10||y1-y0<10)continue;
    const cx=(x0+x1)/2/W,cy=(y0+y1)/2/H;if(Math.abs(cy-(ry/H))<.07)continue;
    if([[.62,.1,.17,.2],[.08,.12,.12,.14],[.3,.48,.1,.1]].some(([p,q,w,h])=>cx>p&&cx<p+w&&cy>q&&cy<q+h))continue;
    const n=1+Math.floor(R()*3);for(let k=0;k<n;k++){const bw=(x1-x0)*(.3+R()*.5),bh=(y1-y0)*(.3+R()*.5);const bx=x0+R()*((x1-x0)-bw),by=y0+R()*((y1-y0)-bh);o.push(`<rect class="m-bld" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5"/>`)}}
  o.push(`<path class="m-water" d="${river}" fill="none" stroke-width="58" stroke="currentColor" style="stroke:var(--mw,#A9D3F2)"/>`.replace('class="m-water"','class="m-waterline"'));
  const streets=[...hs.map(y=>`M0 ${y.toFixed(1)} H${W}`),...vs.map(x=>`M${x.toFixed(1)} 0 V${H}`)].join(" ");
  o.push(`<path class="m-ro" d="${streets}" stroke-width="7.5"/><path class="m-r" d="${streets}" stroke-width="5"/>`);
  const art=`M0 ${hs[Math.floor(hs.length/3)]} H${W} M${vs[Math.floor(vs.length*.55)]} 0 V${H}`;
  o.push(`<path class="m-ro" d="${art}" stroke-width="15"/><path class="m-r" d="${art}" stroke-width="11"/>`);
  const main=`M${W*.02} ${H*.95} C${W*.25} ${H*.62} ${W*.45} ${H*.5} ${W*.62} ${H*.34} S${W*.9} ${H*.08} ${W*1.02} ${H*.02}`;
  o.push(`<path class="m-mo" d="${main}" stroke-width="19"/><path class="m-m" d="${main}" stroke-width="13"/>`);
  o.push(`<text class="m-lbl" x="${W*.705}" y="${H*.21}" text-anchor="middle">공원</text><text class="m-lblw" x="${W*.2}" y="${ry-6}">하천</text>`);
  return o.join("");
}
