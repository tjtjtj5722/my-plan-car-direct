  "buy-import":{name:"수입차 구매 대행",tab:"services",steps:[{k:"차급",q:"어떤 차를 생각하세요?",o:CLASSES},{k:"구매 방식",q:"구매 방식은요?",o:["일시불","할부","리스와 비교하고 싶어요"]},{k:"희망 시기",q:"언제쯤 받고 싶으세요?",o:["3개월 이내","6개월 이내","미정"]}]},
  "rent":{name:"다이렉트 장기렌트",tab:"services",steps:[{k:"차급",q:"어떤 차를 타고 싶으세요?",o:CLASSES},{k:"계약 기간",q:"얼마나 타실 예정인가요?",o:["24개월","36개월","48개월","60개월","상담 후 결정"]},{k:"연간 주행거리",q:"1년에 얼마나 운전하세요?",o:["1만 km 이하","2만 km 정도","3만 km 정도","3만 km 이상"]},{k:"초기 비용",q:"처음에 내는 돈은 어떻게 할까요?",o:["보증금·선납금 없이","보증금 있음","선납금 있음","상담 후 결정"]}]},
  "lease":{name:"다이렉트 자동차 리스",tab:"services",steps:[{k:"리스 종류",q:"어떤 리스를 생각하세요?",o:["운용리스","금융리스","잘 모르겠어요"]},{k:"차급",q:"어떤 차를 생각하세요?",o:CLASSES},{k:"계약 기간",q:"얼마나 이용하실 예정인가요?",o:["24개월","36개월","48개월","60개월","상담 후 결정"]},{k:"이용자",q:"개인인가요, 사업자인가요?",o:["개인","개인사업자","법인"]}]},
  "insure":{name:"자동차 다이렉트 보험",tab:"services",steps:[{k:"상황",q:"지금 어떤 상황이세요?",o:["만기가 다가와요","새 차라 처음 가입해요","보장만 비교해 보고 싶어요"]},{k:"만기 시기",q:"보험 만기는 언제인가요?",o:["이번 달","다음 달","2~3개월 후","잘 모르겠어요"]},{k:"운전자 범위",q:"누가 운전하나요?",o:["본인만","부부","가족","누구나"]}]},
  "repair":{name:"정비·점검 예약 상담",tab:"services",steps:[{k:"점검 항목",q:"어떤 점검이 필요하세요?",o:["정기 점검","엔진오일","타이어","브레이크","배터리","에어컨","기타"],multi:true},{k:"희망 시기",q:"언제 맡기고 싶으세요?",o:["이번 주","다음 주","날짜는 상담 때"]}]},
  "sell":{name:"중고차 다이렉트 판매",tab:"services",steps:[{k:"차량번호",q:"차량번호를 알려 주세요",text:"plate"},{k:"주행거리",q:"지금까지 얼마나 달렸나요?",o:["3만 km 미만","3~6만 km","6~10만 km","10~15만 km","15만 km 이상"]},{k:"사고 이력",q:"사고 이력이 있나요?",o:["없어요","있어요","잘 모르겠어요"]},{k:"원하는 방식",q:"어떻게 팔고 싶으세요?",o:["매입 상담","직거래 도움","시세만 먼저 알고 싶어요"]}]},
  "accident":{name:"사고 접수",tab:"home",steps:[{k:"사고 시점",q:"언제 사고가 났나요?",o:["방금","오늘","어제","며칠 전"]},{k:"다친 사람",q:"다친 사람이 있나요?",o:["없어요","있어요 (119 신고함)","있어요 (아직 신고 전)","잘 모르겠어요"]},{k:"사고 종류",q:"어떤 사고인가요?",o:["차 대 차","차 대 사람","단독 사고","주차 중 사고","기타"]},{k:"내 보험사",q:"가입한 보험사는 어디인가요?",o:["삼성화재","현대해상","DB손해보험","KB손해보험","메리츠화재","한화손해보험","롯데손해보험","흥국화재","하나손해보험","AXA손해보험","캐롯손해보험","MG손해보험","잘 모르겠어요"]},{k:"보험사 접수",q:"보험사에 사고 접수를 했나요?",o:["했어요","아직 안 했어요","도움이 필요해요"]}]},
  "direct":{name:"중고차 직거래·매입",tab:"services",steps:[{k:"원하는 도움",q:"어떤 도움이 필요하세요?",o:["직거래 서류·절차 안내","매입 상담","살 사람은 정했어요, 절차만 도와주세요"]},{k:"차량번호",q:"차량번호를 알려 주세요",text:"plate"}]}
};
const PICK={name:"상담 신청",tab:"home",steps:[{k:"서비스",q:"어떤 상담이 필요하세요?",o:Object.values(WIZ).map(w=>w.name)}]};
const PLATE=/^\d{2,3}\s?[가-힣]\s?\d{4}$/;
const store={get(){try{return JSON.parse(localStorage.getItem("cd_requests")||"[]")}catch(e){return[]}},set(v){try{localStorage.setItem("cd_requests",JSON.stringify(v))}catch(e){}}};
let wizState=null,pendingPlate="";

function startWizard(id){
  if(wizState&&wizState.id===id)return renderWizard();
  const def=id==="pick"?PICK:WIZ[id];
  if(!def){location.hash="#home";return}
  wizState={id,name:def.name,tab:def.tab,steps:def.steps,i:0,a:{}};
  if(pendingPlate&&def.steps.some(s=>s.text==="plate")){wizState.a["차량번호"]=pendingPlate;pendingPlate=""}
  renderWizard();
}
function renderWizard(){
  const W=wizState,box=$("#wiz"),n=W.steps.length+1;
  if(W.done){
    box.innerHTML=`<div class="done-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
      <div style="text-align:center;display:grid;gap:6px"><h2 style="font-size:22px">신청서 작성 완료! 마지막 한 단계</h2></div>${leadSend(W.name||"상담 신청",W.a,false)}
      <dl class="card summary">${Object.entries(W.a).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(Array.isArray(v)?v.join(", "):v)}</dd></div>`).join("")}</dl>
      <a class="btn btn-amber" href="#my">내 신청 내역 보기</a><a class="btn btn-line" href="#home">홈으로</a>`;
    return;
  }
  const last=W.i===W.steps.length,pct=Math.round(W.i/n*100);
  let body="";
  if(last){
    body=`<div class="q">연락받을 정보를 남겨 주세요</div>
      <div class="field"><label for="wName">이름</label><input id="wName" type="text" autocomplete="name" value="${esc(W.a._name||"")}"></div>
      <div class="field"><label for="wTel">연락처</label><input id="wTel" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" value="${esc(W.a._tel||"")}"></div>
      <div class="field"><label for="wMemo">더 알려 주실 내용 <span class="muted small">(선택)</span></label><input id="wMemo" type="text" value="${esc(W.a._memo||"")}" placeholder="예: 타던 차 판매도 같이 상담받고 싶어요"></div>
      <label class="consent"><input id="wAgree" type="checkbox"><span>상담을 위해 이름·연락처·신청 내용을 수집하며 상담 완료 후 파기합니다. 개인정보 수집·이용에 동의합니다. (필수)</span></label>`;
  }else{
    const s=W.steps[W.i];
    if(s.text==="plate"){
      body=`<div class="q">${s.q}</div><label class="plate" for="wPlate"><input id="wPlate" type="text" placeholder="12가 3456" maxlength="10" autocomplete="off" value="${esc(W.a[s.k]||"")}" aria-label="차량번호"></label><p class="small muted">번호판에 적힌 그대로 입력해 주세요.</p>`;
    }else{
      const cur=W.a[s.k]||(s.multi?[]:"");
      body=`<div class="q">${s.q}</div>${s.multi?'<p class="small muted">여러 개 고를 수 있어요.</p>':""}<div class="opts">${s.o.map(o=>{const on=s.multi?cur.includes(o):cur===o;return`<button type="button" class="opt" aria-pressed="${on}" data-o="${esc(o)}">${esc(o)}<span class="ck">${on?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7"/></svg>':""}</span></button>`}).join("")}</div>`;
    }
  }
  box.innerHTML=`<div class="prog"><small>${W.i+1} / ${n}</small><div class="prog-bar"><i style="width:${pct}%"></i></div></div>${body}<div class="err" id="wErr" aria-live="polite"></div>
    <div class="wiz-nav"><button class="btn btn-line" type="button" id="wPrev">${W.i===0?"취소":"이전"}</button><button class="btn btn-amber" type="button" id="wNext">${last?"신청하기":"다음"}</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const s=W.steps[W.i],o=b.dataset.o;
    if(W.id==="pick"){const id=Object.keys(WIZ).find(k=>WIZ[k].name===o);wizState=null;location.hash="#w-"+id;return}
    if(s.multi){const c=W.a[s.k]||[];W.a[s.k]=c.includes(o)?c.filter(x=>x!==o):[...c,o];renderWizard()}
    else{W.a[s.k]=o;W.i++;renderWizard()}
  }));
  const saveText=()=>{const p=$("#wPlate");if(p)W.a[W.steps[W.i].k]=p.value.trim();const nm=$("#wName");if(nm){W.a._name=nm.value.trim();W.a._tel=$("#wTel").value.trim();W.a._memo=$("#wMemo").value.trim()}};
  $("#wPrev").addEventListener("click",()=>{saveText();if(W.i===0){wizState=null;history.length>1?history.back():location.hash="#home"}else{W.i--;renderWizard()}});
  $("#wNext").addEventListener("click",()=>{
    const err=$("#wErr");saveText();
    if(last){
      const tel=(W.a._tel||"").replace(/\D/g,"");
      if(!W.a._name){err.textContent="이름을 입력해 주세요.";return}
      if(tel.length<10||tel.length>11){err.textContent="연락처를 숫자 10~11자리로 입력해 주세요.";return}
      if(!$("#wAgree").checked){err.textContent="개인정보 수집·이용에 동의해 주세요.";return}
      const answers={};Object.entries(W.a).forEach(([k,v])=>{if(!k.startsWith("_"))answers[k]=v});
      const list=store.get();list.unshift({service:W.name,at:new Date().toISOString(),answers});store.set(list);
      const shown=Object.assign({},answers,{"이름":W.a._name,"연락처":W.a._tel});if(W.a._memo)shown["추가 내용"]=W.a._memo;
      W.a=shown;W.done=true;renderWizard();botSay("마지막으로 [문자로 접수 보내기]를 눌러 주세요!");return;
    }
    const s=W.steps[W.i];
    if(s.text==="plate"){if(!PLATE.test((W.a[s.k]||"").trim())){err.textContent="차량번호를 12가 3456 형식으로 입력해 주세요.";return}}
    else if(s.multi?!(W.a[s.k]||[]).length:!W.a[s.k]){err.textContent="하나를 골라 주세요.";return}
    W.i++;renderWizard();
  });
}
function renderMy(){
  const list=store.get(),box=$("#myList");
  if(!list.length){box.innerHTML=`<div class="empty" style="border:0"><b>아직 신청한 상담이 없습니다</b><span class="muted small">서비스를 골라 질문에 답하면 여기에 쌓입니다.</span><a class="pill-btn" href="#consult">상담 신청하기</a></div>`;return}
  box.innerHTML=list.map(r=>{const d=new Date(r.at);const ds=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
    return`<div class="req"><b>${esc(r.service)}</b><span>${ds} · 시안(미접수)</span><span>${esc(Object.values(r.answers).map(v=>Array.isArray(v)?v.join("·"):v).join(" / "))}</span></div>`}).join("");
}

/* ---------- 화면 이동 ---------- */
const screens=[...document.querySelectorAll(".screen")];
const ROOTS=["home","services","learn","menu"];
const PARENT={class:"home",course:"home","course-notice":"course","course-reviews":"course",settle:"home",buy:"services",ride:"services",care:"services",sell:"services",my:"menu",faq:"menu",about:"menu",rooms:"menu",info:"menu",reviews:"menu",accident:"home",zacha:"home",tips:"home",letters:"home",press:"home",calendar:"home",cases:"menu",comics:"menu",tools:"home",search:"home",myplan:"home",map:"home",quote:"home"};
function route(){
  let h=(location.hash||"#home").slice(1);
  if(h==="consult")h="w-pick";
  let name=h;
  if(h.startsWith("w-")){name="wizard";startWizard(h.slice(2))}
  const scr=screens.find(s=>s.dataset.screen===name)||screens[0];
  screens.forEach(s=>s.hidden=s!==scr);
  const key=scr.dataset.screen;
  const tab=key==="wizard"?(wizState&&wizState.tab):(ROOTS.includes(key)?key:(PARENT[key]||"home"));
  document.querySelectorAll(".tabs a").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  $("#topTitle").textContent=key==="wizard"?(wizState?wizState.name:"상담 신청"):scr.dataset.title;
  $("#back").hidden=ROOTS.includes(key);
  if(key==="my")renderMy();
  afterRoute(key);
  navMark(key);
  if(key==="comics"){renderMedia();bindAdmin()}
  if(key==="map")renderMap();
  if(key==="menu"){const n=store.get().length;$("#myCount").textContent=n?n+"건 신청":"이 기기에서 신청한 내역"}
  window.scrollTo(0,0);
}
$("#back").addEventListener("click",()=>{if(history.length>1)history.back();else location.hash="#home"});
(()=>{const inp=$("#plateHome"),clr=$("#plateClear");if(inp&&clr){inp.addEventListener("input",()=>{clr.hidden=!inp.value});clr.onclick=()=>{inp.value="";clr.hidden=true;inp.focus()}}})();
$("#plateForm").addEventListener("submit",e=>{e.preventDefault();const v=$("#plateHome").value.trim();
  if(!PLATE.test(v)){$("#plateErr").textContent="차량번호를 12가 3456 형식으로 입력해 주세요.";return}
  $("#plateErr").textContent="";pendingPlate=v;wizState=null;location.hash="#w-sell"});
document.querySelectorAll("[data-seg]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-seg]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  const r=b.dataset.seg==="rent";$("#rideGo").href=r?"#w-rent":"#w-lease";$("#rideGo").textContent=(r?"장기렌트":"리스")+" 상담 신청"}));
document.querySelectorAll("[data-lseg]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-lseg]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  showLearn(b.dataset.lseg)}));
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]");if(!b)return;
  const val=b.dataset.copy||PHONE;
  const wrap=b.closest(".card"),note=wrap&&wrap.querySelector(".note"),num=(b.closest(".call,.ins-row")||b.parentNode).querySelector("strong");
  const say=t=>{if(note)note.textContent=t;else{const o=b.textContent;b.textContent=t.length>6?"선택됨":"복사됨";setTimeout(()=>{if(b.isConnected)b.textContent=o},2000)}};
  const sel=()=>{if(num){const r=document.createRange();r.selectNodeContents(num);const s=getSelection();s.removeAllRanges();s.addRange(r)}say("번호를 선택했습니다. 길게 눌러 복사하세요.")};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(val).then(()=>say("복사됨")).catch(sel);else sel();
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(!h.startsWith("w-")&&h!=="consult")wizState=null;route()});
$("#lbClose").onclick=closeLb;
$("#lbPrev").onclick=()=>{if(lbIdx>0){lbIdx--;drawLb()}};
$("#lbNext").onclick=()=>{if(lbIdx<lbList.length-1){lbIdx++;drawLb()}};
document.addEventListener("keydown",e=>{if($("#lb").hidden)return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")$("#lbPrev").click();if(e.key==="ArrowRight")$("#lbNext").click()});
let tx=null;$("#lbImgWrap").addEventListener("touchstart",e=>{tx=e.touches.length===1?e.touches[0].clientX:null},{passive:true});
$("#lbImgWrap").addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)(dx<0?$("#lbNext"):$("#lbPrev")).click()},{passive:true});
window.addEventListener("hashchange",closeLb);
initTools();
initSearch();
initBot();
initSheet();
initQuote();
drawMaps();
renderInsurers();
renderContent();
route();
})();
</script>
